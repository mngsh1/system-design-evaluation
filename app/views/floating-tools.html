<!-- ====================================================================
     Persistent Clarification Drawer (Accessible across Phases 1-5)
     ==================================================================== -->
<button id="btn-toggle-clarify-drawer" class="floating-drawer-btn" title="Ask Interviewer / View Clarifications">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  <span>Clarifications</span>
</button>

<div class="modal-backdrop drawer-backdrop" id="clarify-drawer-backdrop">
  <div class="drawer-panel" id="clarify-drawer-panel">
    <div class="drawer-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#06B6D4" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <div>
          <h3 class="drawer-title">Clarification & Scope Agent</h3>
          <span style="font-size: 10px; color: var(--text-muted);">Ask interviewer about scale, SLAs, & boundaries</span>
        </div>
      </div>
      <button id="btn-close-clarify-drawer" class="icon-btn" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="drawer-body" id="clarify-drawer-messages">
      <p style="color: var(--text-muted);">No clarification notes recorded yet.</p>
    </div>

    <!-- Interactive Drawer Chat Input -->
    <div class="drawer-footer" style="padding: 12px 16px; background: var(--bg-surface-elevated); border-top: 1px solid var(--border-medium); display: flex; flex-direction: column; gap: 8px;">
      <div id="drawer-typing-indicator" class="typing-indicator-box hidden" style="padding: 4px 10px; font-size: 11px;">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span style="color: var(--text-muted); margin-left: 4px;">Interviewer is responding...</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="drawer-clarify-input" class="form-input" placeholder="Ask interviewer to clarify traffic, storage, latency..." style="font-size: 12px; height: 38px;">
        <button id="btn-drawer-clarify-send" class="btn btn-primary btn-sm" style="height: 38px; padding: 0 14px; flex-shrink: 0;">
          <span>Ask</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ====================================================================
     Floating Context-Aware Assistant Widget
     ==================================================================== -->
<div id="floating-assistant-widget" class="floating-assistant-container">
  <!-- Minimized Launch Pill -->
  <button id="btn-toggle-assistant" class="floating-assistant-btn" title="Open AI System Design Assistant">
    <div class="assistant-btn-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10a9.96 9.96 0 0 1-4.587-1.112L2 22l1.112-5.413A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2z"/>
      </svg>
      <span id="assistant-unread-dot" class="pulse-dot active-dot" style="position: absolute; top: 0; right: 0;"></span>
    </div>
    <span class="assistant-btn-label">AI Assistant</span>
  </button>

  <!-- Assistant Chat Window -->
  <div class="assistant-panel" id="assistant-panel">
    <div class="assistant-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="logo-badge" style="width: 24px; height: 24px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#06B6D4" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 12h8M12 8v8"/>
          </svg>
        </div>
        <div>
          <h4 class="assistant-title">System Design Copilot</h4>
          <span class="assistant-sub">Context-Aware Assistant</span>
        </div>
      </div>
      <button id="btn-minimize-assistant" class="icon-btn" title="Minimize Assistant">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>

    <div class="assistant-body" id="assistant-chat-messages"></div>

    <div id="assistant-typing-indicator" class="typing-indicator-box hidden" style="padding: 6px 14px;">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span style="font-size: 11px; color: var(--text-muted); margin-left: 6px;">Thinking...</span>
    </div>

    <div class="assistant-footer">
      <textarea id="assistant-chat-input" class="form-textarea assistant-input" rows="1" placeholder="Ask a question about your draft math/requirements..."></textarea>
      <button id="btn-send-assistant" class="btn btn-primary btn-sm" style="height: 36px; padding: 0 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>
